name: Validate R project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Install JAGS
        run: sudo apt-get update && sudo apt-get install -y jags libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Validate syntax, paths, parity, and dependencies
        run: Rscript scripts/validate_reproducibility.R
