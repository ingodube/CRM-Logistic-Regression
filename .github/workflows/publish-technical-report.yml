name: Publish technical report

on:
  push:
    branches: [main]
    paths:
      - "report/**"
      - "scripts/**"
      - "tools/**"
      - "Spreadsheets (EN)/**"
      - "Spreadsheets (PT-BR)/**"
      - "Results (EN)/**"
      - "Results (PT-BR)/**"
      - "renv.lock"
      - ".github/workflows/publish-technical-report.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jags poppler-utils libglpk-dev libxml2-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Localize analytical repository artifacts
        run: python tools/localize_repository.py

      - name: Prepare lightweight bilingual data
        run: Rscript scripts/prepare_report_data.R

      - name: Render bilingual reports
        run: Rscript scripts/render_reports.R

      - name: Validate bilingual reports
        run: Rscript scripts/validate_reports.R

      - name: Compare protected PT-BR text with the source PDF
        run: Rscript scripts/compare_report_text.R

      - name: Validate analytical reproducibility
        run: Rscript scripts/validate_reproducibility.R

      - name: Verify renv status
        run: Rscript -e 'renv::status()'

      - name: Verify generated files
        run: git diff --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: render
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
