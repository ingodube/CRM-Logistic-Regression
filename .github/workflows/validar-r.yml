name: Validar projeto R

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Instalar JAGS
        run: sudo apt-get update && sudo apt-get install -y jags libglpk-dev libxml2-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Validar sintaxe, caminhos e dependências
        run: Rscript scripts/validar_reprodutibilidade.R
